user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # Gzip
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/rss+xml
                    application/atom+xml image/svg+xml;

    # Rate limiting zones
    # NOTE: Replace "yourdomain.com" throughout this file with your actual domain
    limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=60r/m;
    limit_req_zone  $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone  $binary_remote_addr zone=chat_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Real client IP behind Cloudflare.
    # CF-Connecting-IP is trusted ONLY when the connection comes from a Cloudflare
    # range; direct hits keep their own address, so the header can't be spoofed.
    # With this, $remote_addr (rate-limit zones, X-Real-IP) is the visitor, not CF.
    # Ranges: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header   CF-Connecting-IP;

    # Visitors who reached Cloudflare over plain http (it passes their
    # protocol in X-Forwarded-Proto) are sent to https: the auth cookies are
    # Secure. Let's Encrypt challenges stay on http.
    map "$http_x_forwarded_proto $uri" $redirect_to_https {
        default                                     0;
        "~^http /(?!\.well-known/acme-challenge/)"  1;
    }

    # ============================================
    # HTTP + HTTPS — Main Server (alkhizaei.com behind Cloudflare, Full strict)
    # Port 80 stays open for Let's Encrypt HTTP-01 challenges.
    # ============================================
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        ssl_certificate     /etc/letsencrypt/live/alkhizaei.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/alkhizaei.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        server_name _;

        if ($redirect_to_https) {
            return 301 https://$host$request_uri;
        }

        # Security headers (X-Frame-Options is set by Next.js middleware)
        add_header X-Content-Type-Options     "nosniff"                                     always;
        add_header X-XSS-Protection           "1; mode=block"                               always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"    always;

        # Upload size (matches app 50MB limit)
        client_max_body_size  50M;
        client_body_timeout   60s;
        client_header_timeout 60s;

        # Connection limit per IP
        limit_conn conn_limit 20;

        # Certbot challenge passthrough (for future SSL setup)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Auth endpoints — strict rate limit
        location ~ ^/api/v1/auth/ {
            limit_req        zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # AI chat — tight per-IP limit, small bodies, streamed responses
        location = /api/v1/chat {
            limit_req        zone=chat_limit burst=5 nodelay;
            limit_req_status 429;
            limit_except POST { deny all; }
            client_max_body_size 64k;

            proxy_pass         http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_read_timeout 90s;
        }

        # API endpoints — standard rate limit
        location /api/ {
            limit_req        zone=api_limit burst=30 nodelay;
            limit_req_status 429;

            proxy_pass         http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Static Next.js assets — long cache
        location /_next/static/ {
            proxy_pass       http://app:3000;
            proxy_set_header Host $host;
            add_header       Cache-Control "public, max-age=31536000, immutable";
        }

        # MinIO Console (admin UI) — not exposed publicly.
        # Access it via SSH tunnel instead: ssh -p <ssh-port> -L 9001:<minio-ip>:9001 user@server
        location /minio-console/ {
            return 404;
        }

        # MinIO — public static files (uploaded images/videos)
        location /minio/ {
            proxy_pass         http://minio:9000/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            client_max_body_size 50M;
        }

        # Main application
        location / {
            proxy_pass         http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90s;
        }
    }
}
